name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: licitalens_test
          POSTGRES_USER: licitalens
          POSTGRES_PASSWORD: integration-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U licitalens -d licitalens_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://licitalens:integration-only@localhost:5432/licitalens_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: licitalens-backend/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: azure/setup-helm@v4
      - name: Validate backend
        working-directory: licitalens-backend
        run: |
          go test -race ./...
          go vet ./...
          go build ./cmd/...
      - name: Validate web application
        working-directory: licitalens-mobile
        run: |
          bun install --frozen-lockfile
          bun run generate:sdk
          git diff --exit-code -- src/api/schema.d.ts
          bun run typecheck
          bunx expo export --platform web
      - name: Validate Helm chart
        working-directory: licitalens-backend
        run: |
          helm lint deploy/helm/licitalens
          helm template release deploy/helm/licitalens > /dev/null
      - name: Validate self-hosted manifest
        working-directory: licitalens-backend/deploy/self-hosted
        run: |
          ./setup.sh
          docker compose config --quiet

  backend-images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, tenancy, ingestion, procurement, intelligence, notifications, billing]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: licitalens-backend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  web-image:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: licitalens-mobile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  github-release:
    needs: [backend-images, web-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "${GITHUB_REF_NAME}" --title "LicitaLens ${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
