name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licitalens-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: licitalens-backend/go.sum
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - run: go build ./cmd/...

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licitalens-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  helm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: licitalens-backend
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/licitalens
      - run: helm template test deploy/helm/licitalens > /dev/null

  images:
    if: github.event_name == 'push'
    needs: [backend, helm]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, tenancy, ingestion, procurement, intelligence, notifications]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: licitalens-backend
          push: false
          build-args: SERVICE=${{ matrix.service }}
          tags: licitalens-${{ matrix.service }}:${{ github.sha }}
