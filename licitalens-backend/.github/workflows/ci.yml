name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: "1.25.x", cache: true }
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - run: go build ./cmd/...
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/licitalens
      - run: helm template test deploy/helm/licitalens > /dev/null
  images:
    if: github.event_name == 'push'
    needs: [test, helm]
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [gateway, tenancy, ingestion, procurement, intelligence, notifications] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: SERVICE=${{ matrix.service }}
          tags: licitalens-${{ matrix.service }}:${{ github.sha }}
