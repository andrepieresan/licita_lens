# nginx dentro do Docker (compose.prod.yaml).
# Substitua seudominio.com. Montar certificados em deploy/nginx/certs/ ou use certbot no host + volume.
# Build do app: cd licitalens-mobile && EXPO_PUBLIC_API_URL=https://api.seudominio.com npx expo export --platform web

upstream licitalens_api {
    server gateway:8080;
    keepalive 8;
}

upstream licitalens_auth {
    server keycloak:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.seudominio.com;

    root /usr/share/nginx/html/app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.seudominio.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://licitalens_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.seudominio.com;

    location / {
        proxy_pass http://licitalens_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
