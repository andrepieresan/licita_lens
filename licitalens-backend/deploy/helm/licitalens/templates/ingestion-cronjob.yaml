{{- if .Values.ingestionCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "licitalens.fullname" . }}-ingestion
  labels: { app.kubernetes.io/name: ingestion, app.kubernetes.io/part-of: licitalens }
spec:
  schedule: {{ .Values.ingestionCronJob.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.ingestionCronJob.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.ingestionCronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.ingestionCronJob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.ingestionCronJob.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.ingestionCronJob.activeDeadlineSeconds }}
      template:
        metadata:
          labels: { app.kubernetes.io/name: ingestion, app.kubernetes.io/part-of: licitalens }
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532 }
          containers:
            - name: ingestion
              image: "{{ .Values.image.repository }}-ingestion:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - { name: PORT, value: "8080" }
                - { name: PNCP_RUN_ONCE, value: "true" }
                {{- range $key, $value := (.Values.serviceEnv.ingestion | default dict) }}
                - { name: {{ $key | quote }}, value: {{ $value | quote }} }
                {{- end }}
              envFrom:
                - secretRef: { name: {{ .Values.secretName }} }
              resources: {{ toYaml .Values.resources | nindent 16 }}
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
{{- end }}
