{{- if .Values.local.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "licitalens.fullname" . }}-postgres
spec:
  selector: { app.kubernetes.io/name: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "licitalens.fullname" . }}-postgres
spec:
  serviceName: {{ include "licitalens.fullname" . }}-postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.local.postgres.image | quote }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: licitalens }
            - { name: POSTGRES_USER, value: licitalens }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } }
          readinessProbe:
            exec: { command: ["sh", "-ec", "pg_isready -U licitalens -d licitalens"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.local.postgres.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "licitalens.fullname" . }}-redpanda
spec:
  selector: { app.kubernetes.io/name: redpanda, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: kafka, port: 9092, targetPort: kafka }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "licitalens.fullname" . }}-redpanda
spec:
  serviceName: {{ include "licitalens.fullname" . }}-redpanda
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redpanda, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redpanda, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: redpanda
          image: {{ .Values.local.redpanda.image | quote }}
          args: ["start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--node-id", "0", "--check=false", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "{{ include "licitalens.fullname" . }}-redpanda:9092"]
          ports: [{ name: kafka, containerPort: 9092 }]
          readinessProbe: { tcpSocket: { port: kafka }, initialDelaySeconds: 10, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/redpanda/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.local.redpanda.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "licitalens.fullname" . }}-minio
spec:
  selector: { app.kubernetes.io/name: minio, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: s3, port: 9000, targetPort: s3 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "licitalens.fullname" . }}-minio
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: minio, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: minio
          image: {{ .Values.local.minio.image | quote }}
          command: ["minio", "server", "/data"]
          ports: [{ name: s3, containerPort: 9000 }]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: MINIO_ROOT_PASSWORD } }
          readinessProbe: { httpGet: { path: /minio/health/live, port: s3 }, initialDelaySeconds: 10, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: {{ include "licitalens.fullname" . }}-minio } }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "licitalens.fullname" . }}-minio
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.local.minio.storage }} } }
{{- end }}
