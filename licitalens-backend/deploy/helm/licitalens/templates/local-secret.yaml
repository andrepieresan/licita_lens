{{- if .Values.local.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.local.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgres://licitalens:%s@%s-postgres:5432/licitalens" .Values.local.secrets.postgresPassword (include "licitalens.fullname" .) | quote }}
  MINIO_ROOT_USER: {{ .Values.local.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.local.secrets.minioRootPassword | quote }}
  KAFKA_BROKERS: {{ printf "%s-redpanda:9092" (include "licitalens.fullname" .) | quote }}
  S3_ENDPOINT: {{ printf "%s-minio:9000" (include "licitalens.fullname" .) | quote }}
  S3_ACCESS_KEY: {{ .Values.local.secrets.minioRootUser | quote }}
  S3_SECRET_KEY: {{ .Values.local.secrets.minioRootPassword | quote }}
  S3_BUCKET: licitalens-raw
  S3_SECURE: "false"
  AUTH_JWT_SECRET: {{ .Values.local.secrets.authJwtSecret | quote }}
  ADMIN_API_KEY: {{ .Values.local.secrets.adminApiKey | quote }}
{{- end }}
