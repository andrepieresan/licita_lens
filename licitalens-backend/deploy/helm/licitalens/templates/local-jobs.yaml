{{- if .Values.local.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "licitalens.fullname" . }}-schema
data:
  001_schema.psql: |
{{ .Files.Get "files/001_schema.psql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "licitalens.fullname" . }}-migrate
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.local.migrationImage | quote }}
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } }
          command: ["sh", "-ec"]
          args: ["until pg_isready -h {{ include "licitalens.fullname" . }}-postgres -U licitalens -d licitalens; do sleep 2; done; psql -v ON_ERROR_STOP=1 -h {{ include "licitalens.fullname" . }}-postgres -U licitalens -d licitalens -f /migrations/001_schema.psql"]
          volumeMounts: [{ name: schema, mountPath: /migrations }]
      volumes: [{ name: schema, configMap: { name: {{ include "licitalens.fullname" . }}-schema } }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "licitalens.fullname" . }}-topics
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: {{ .Values.local.topicInitImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until rpk topic create procurement.discovered.v1 -p 3 -r 1 -X brokers={{ include "licitalens.fullname" . }}-redpanda:9092; do sleep 2; done
              rpk topic create procurement.dead-letter.v1 -p 3 -r 1 -X brokers={{ include "licitalens.fullname" . }}-redpanda:9092 || true
{{- if .Values.local.bootstrap.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "licitalens.fullname" . }}-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}-admin:{{ .Values.image.tag }}"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: postgres://licitalens:$(POSTGRES_PASSWORD)@{{ include "licitalens.fullname" . }}-postgres:5432/licitalens
            - name: BOOTSTRAP_PASSWORD
              value: {{ .Values.local.bootstrap.password | quote }}
          args:
            - --email={{ .Values.local.bootstrap.email }}
            - "--name={{ .Values.local.bootstrap.name }}"
            - "--organization={{ .Values.local.bootstrap.organization }}"
            - --accept-legal
            - --terms-version={{ .Values.local.bootstrap.termsVersion }}
            - --privacy-version={{ .Values.local.bootstrap.privacyVersion }}
{{- end }}
{{- end }}
